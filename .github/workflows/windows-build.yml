name: Windows build

on:
  push:
    branches: ['**']
    paths: ['app/**', '.github/workflows/windows-build.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target

      - run: npm ci
      - run: npx tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: factory-archive-windows
          path: |
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/msi/*.msi
            app/src-tauri/target/release/factory-archive.exe
