name: Release

# Three ways to publish an update (installed apps pick it up via latest.json on the newest release):
#   1. Bump "version" in app/src-tauri/tauri.conf.json and push to main. It releases if that
#      version has no release yet.
#   2. Push a tag: git tag v0.2.0 && git push origin v0.2.0
#   3. Actions → Release → Run workflow, with a version.
on:
  push:
    branches: [main]
    paths: ['app/src-tauri/tauri.conf.json', '.github/workflows/release.yml']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without the v (e.g. 0.2.0)'
        required: true

permissions:
  contents: write

jobs:
  # Decide which version to release, and skip if it's already released.
  plan:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      go: ${{ steps.v.outputs.go }}
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT" ]; then v="$INPUT"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then v="${GITHUB_REF_NAME}"
          else v=$(node -p 'require("./app/src-tauri/tauri.conf.json").version'); fi
          v="${v#v}"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF_TYPE}" = "branch" ] && gh release view "v$v" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v$v is already released; bump the version in tauri.conf.json to publish a new one."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "Releasing v$v"
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      # Release notes: commit subjects since the previous app release (minus version bumps).
      # They become the release body and latest.json's notes, which the update banner shows.
      - id: notes
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.v.outputs.version }}
        run: |
          prev=$(gh release list -R "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq "[.[].tagName | select(startswith(\"v\") and . != \"v$V\")][0] // empty")
          changes=""
          if [ -n "$prev" ] && git rev-parse -q --verify "refs/tags/$prev" >/dev/null; then
            changes=$(git log "$prev..HEAD" --no-merges --format='- %s' | grep -v -E '^- Release [0-9]' || true)
          fi
          {
            echo 'notes<<NOTES_EOF'
            if [ -n "$changes" ]; then echo "What's new:"; echo "$changes"; echo; fi
            echo "Download the installer for your platform below. Installed copies update themselves."
            echo 'NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

  release:
    needs: plan
    if: needs.plan.outputs.go == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ''
          - os: macos-latest
            args: '--target universal-apple-darwin'
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target

      - name: Stamp version from tag
        shell: bash
        working-directory: app
        run: |
          v="${VERSION#v}"
          node -e '
            const fs = require("fs"), v = process.argv[1];
            if (!/^\d+\.\d+\.\d+(-[\w.]+)?$/.test(v)) { console.error("bad version: " + v); process.exit(1); }
            for (const f of ["package.json", "src-tauri/tauri.conf.json"]) {
              const j = JSON.parse(fs.readFileSync(f, "utf8")); j.version = v;
              fs.writeFileSync(f, JSON.stringify(j, null, 2) + "\n");
            }' "$v"
          echo "TAG=v$v" >> "$GITHUB_ENV"

      - run: npm ci
        working-directory: app

      # Fail fast with a readable error if the signing key or password is wrong, instead of
      # failing (or waiting on a password prompt) at the end of a long build. Never prints the key.
      - name: Check update signing key
        shell: bash
        working-directory: app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then echo "::error title=Signing key::Secret TAURI_SIGNING_PRIVATE_KEY is empty or missing"; exit 1; fi
          echo "key length: ${#TAURI_SIGNING_PRIVATE_KEY}, password set: $([ -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ] && echo yes || echo no)"
          echo probe > "$RUNNER_TEMP/probe.txt"
          if ! out=$(npx tauri signer sign "$RUNNER_TEMP/probe.txt" < /dev/null 2>&1); then
            msg=$(printf '%s' "$out" | tail -n 8 | sed 's/%/%25/g' | tr '\n' '|')
            echo "::error title=Signing key check failed (password set: $([ -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ] && echo yes || echo no))::$msg"
            exit 1
          fi
          echo "Signing key OK"

      # Bundle the Live mod from the newest mod-v* release so the app can install it in one click.
      # Its .pdb debug symbols are ~97% of the zip and the game doesn't need them, so they're left out.
      - name: Bundle the Live mod
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release list -R "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '[.[].tagName | select(startswith("mod-v"))][0] // empty')
          if [ -z "$tag" ]; then echo "::warning title=Live mod::No mod-v* release yet; shipping without the bundled mod"; exit 0; fi
          gh release download "$tag" -R "$GITHUB_REPOSITORY" -p FactoryArchiveLive.zip -D "$RUNNER_TEMP"
          python3 - "$RUNNER_TEMP/FactoryArchiveLive.zip" app/src-tauri/resources/FactoryArchiveLive.zip <<'EOF'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as src, zipfile.ZipFile(sys.argv[2], 'w', zipfile.ZIP_DEFLATED) as out:
              assert 'FactoryArchiveLive.uplugin' in src.namelist(), 'not the Live mod zip'
              for i in src.infolist():
                  if not i.filename.lower().endswith('.pdb'): out.writestr(i, src.read(i))
          EOF
          echo "Bundled $tag ($(wc -c < app/src-tauri/resources/FactoryArchiveLive.zip) bytes)"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          tagName: ${{ env.TAG }}
          releaseName: Factory Archive ${{ env.TAG }}
          releaseBody: ${{ needs.plan.outputs.notes }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          # a config file, not inline JSON: npm on Windows runs through cmd.exe, which mangles the quotes
          args: ${{ matrix.args }} --config src-tauri/tauri.release.conf.json
