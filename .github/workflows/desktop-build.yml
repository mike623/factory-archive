name: Desktop build

on:
  push:
    branches: ['**']
    paths: ['app/**', '.github/workflows/desktop-build.yml']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: factory-archive-windows
            args: ''
            bundles: |
              app/src-tauri/target/release/bundle/nsis/*.exe
              app/src-tauri/target/release/bundle/msi/*.msi
          - os: macos-latest
            artifact: factory-archive-macos
            args: '--target universal-apple-darwin --bundles dmg'
            bundles: |
              app/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          # universal macOS binaries need both architectures
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target

      - run: npm ci

      # Report whether the release signing key/password work, without failing this build.
      - name: Check update signing key
        if: matrix.os == 'windows-latest'
        continue-on-error: true
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          pw=$([ -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ] && echo yes || echo no)
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then echo "::warning title=Signing key::TAURI_SIGNING_PRIVATE_KEY is empty or missing (password set: $pw)"; exit 1; fi
          echo probe > "$RUNNER_TEMP/probe.txt"
          if out=$(npx tauri signer sign "$RUNNER_TEMP/probe.txt" < /dev/null 2>&1); then
            echo "::notice title=Signing key::OK (key length ${#TAURI_SIGNING_PRIVATE_KEY}, password set: $pw)"
          else
            msg=$(printf '%s' "$out" | grep -iE 'error|password|key' | tail -n 4 | sed 's/%/%25/g' | tr '\n' '|')
            echo "::warning title=Signing key check failed (key length ${#TAURI_SIGNING_PRIVATE_KEY}, password set: $pw)::$msg"
            exit 1
          fi
      # Same settings as Release (signed updater packages), so release problems show up on every push.
      # On failure, the error lines are posted as annotations (readable without a login).
      - name: Build (release settings)
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -o pipefail
          if ! npx tauri build ${{ matrix.args }} --config src-tauri/tauri.release.conf.json < /dev/null 2>&1 | tee "$RUNNER_TEMP/build.log"; then
            grep -iE 'error|failed|cannot|not found|panicked' "$RUNNER_TEMP/build.log" | grep -v 'warning' | tail -n 15 | while IFS= read -r line; do
              echo "::error title=tauri build::$(printf '%s' "$line" | sed 's/%/%25/g' | cut -c1-400)"
            done
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.bundles }}
