[package]
name = "factory-archive"
version = "0.1.0"
description = "Factory Archive — desktop blueprint manager for Satisfactory"
license = "MIT"
repository = "https://github.com/mike623/factory-archive"
edition = "2021"

[lib]
name = "factory_archive_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
if-addrs = "0.15"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
reqwest = { version = "0.13", features = ["blocking"] }
url = "2"
sha2 = "0.10"
base64 = "0.22"
flate2 = "1"
trash = "5"
